sonar.organization=soltecsis
sonar.projectKey=soltecsis_fwcloud-agent
# Project key is required through the SONAR_PROJECT_KEY Actions variable.
sonar.projectName=FWCloud-Agent
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=src/**/*_tests.rs,src/**/*-tests.rs,src/**/tests.rs,tests/**/*.rs
# Classify test-only modules separately; no production coverage exclusions.
sonar.exclusions=src/**/*_tests.rs,src/**/*-tests.rs,src/**/tests.rs
sonar.rust.lcov.reportPaths=coverage-input/lcov.info
sonar.rust.clippyReport.reportPaths=clippy-input/clippy.json
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
