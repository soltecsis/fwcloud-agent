name: Set up pinned Rust
description: Install and verify the repository Rust toolchain and an optional pinned Cargo utility.
inputs:
  tool:
    description: Optional Cargo utility listed in .github/ci-tools.toml.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install and verify Rust inputs
      shell: bash
      env:
        CI_CARGO_TOOL: ${{ inputs.tool }}
      run: python3 .github/scripts/rust-ci.py setup
    - name: Validate locked dependency resolution before caching
      shell: bash
      # The cache action also runs cargo metadata. Reject stale locks first.
      run: cargo metadata --all-features --locked --format-version 1 > /dev/null
    - name: Restore Cargo cache
      continue-on-error: true
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Keep fallback restores within the exact toolchain, even after updates.
        prefix-key: agent-v1-${{ hashFiles('rust-toolchain.toml') }}
        key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        cache-bin: 'false'
    - name: Upload verified environment metadata
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: agent-environment-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: reports/ci/${{ github.job }}.json
        retention-days: 90
        if-no-files-found: error
