name: FWCloud-Agent CI

on:
  push:
    branches: [main, devel, ENS]
  pull_request:
    branches: [main, devel, ENS]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ANALYSIS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: FWCloud-Agent Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Verify CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify secret report helper
        run: node --test scripts/gitleaks-report.test.cjs
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install and verify ShellCheck
        run: python3 .github/scripts/shellcheck-ci.py install
      - name: Analyze packaged shell scripts
        id: shellcheck
        run: python3 .github/scripts/shellcheck-ci.py analyze
      - name: Upload ShellCheck evidence
        if: ${{ always() && steps.shellcheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-shellcheck-${{ env.ANALYSIS_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/shellcheck/
          retention-days: 90
          if-no-files-found: error
      - name: Verify the committed lockfile is unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- Cargo.lock

  security_audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tool: cargo-audit
      - name: Audit the committed lockfile
        # Retain .cargo/audit.toml; review its existing exception in phase 6.
        run: cargo audit --file Cargo.lock
      - name: Verify the committed lockfile is unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- Cargo.lock

  test:
    name: FWCloud-Agent Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-suffix: -llvm-${{ hashFiles('.github/report-tools.toml') }}
      - name: Install verified reporting tools and LLVM
        run: python3 .github/scripts/install-report-tools.py
      - name: Build instrumented tests and compare discovery
        id: test_build
        run: python3 .github/scripts/test_ci.py build
      - name: Execute the instrumented suite once
        id: test_execution
        run: python3 .github/scripts/test_ci.py test
      - name: Export coverage and enforce the 20% line gate
        if: ${{ always() && steps.test_build.outcome != 'skipped' }}
        run: python3 .github/scripts/test_ci.py reports
      - name: Validate test and coverage evidence
        if: ${{ always() }}
        run: python3 .github/scripts/ci_reports.py
      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/tests/
            reports/metadata.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-coverage-${{ github.run_id }}
          path: reports/coverage/
          overwrite: true
          retention-days: 90
          if-no-files-found: error
      - name: Verify the committed lockfile is unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- Cargo.lock

  secrets:
    name: FWCloud-Agent Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install non-installing package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm cpio
      - uses: ./.github/actions/scan-secrets
        with:
          kind: history
          report-directory: reports/secrets
          artifact-name: agent-secrets-${{ github.run_id }}-${{ github.run_attempt }}

  sca:
    name: FWCloud-Agent Trivy and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - name: Install checksum-verified Trivy
        run: python3 .github/scripts/trivy-ci.py install
      - name: Scan Cargo dependencies and generate CycloneDX
        run: python3 .github/scripts/trivy-ci.py scan
      - name: Upload dependency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-sca-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/sca/
          retention-days: 90
          if-no-files-found: error

  agent-ci:
    name: agent-ci
    if: ${{ always() }}
    needs: [quality, test, security_audit, secrets, sca, deb-package, rpm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every foundation check to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          expected = {"quality", "test", "security_audit", "secrets", "sca", "deb-package", "rpm-package"}
          results = json.loads(os.environ["REQUIRED_RESULTS"])
          if set(results) != expected:
              sys.exit("Missing or unexpected required jobs")
          for job in sorted(expected):
              result = results[job].get("result")
              print(f"{job}: {result}")
              if result != "success":
                  sys.exit(f"Required job did not succeed: {job}")
          PY

  deb-package:
    needs: [quality, test, security_audit, secrets, sca]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: DEB package
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tool: cargo-deb
      - name: Install package build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config musl-tools build-essential
      - name: Install the MUSL target for the pinned toolchain
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-unknown-linux-musl
      - name: Build DEB package from locked sources
        run: |
          mkdir -p packages/deb
          cargo deb --locked --verbose --target=x86_64-unknown-linux-musl --output packages/deb/
      - name: Verify the committed lockfile is unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- Cargo.lock
      - name: Scan generated DEB package
        if: ${{ always() }}
        uses: ./.github/actions/scan-secrets
        with:
          kind: deb
          report-directory: reports/secrets-deb
          artifact-name: agent-secrets-deb-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload DEB package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/deb/*.deb
          retention-days: 14
          if-no-files-found: error

  rpm-package:
    needs: [quality, test, security_audit, secrets, sca]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: RPM package
    env:
      # cargo-rpm otherwise runs an unlocked cargo metadata lookup.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ANALYSIS_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tool: cargo-rpm
      - name: Install package build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm cpio libssl-dev pkg-config musl-tools build-essential
      - name: Install the MUSL target for the pinned toolchain
        run: rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-unknown-linux-musl
      - name: Build the RPM binary from locked sources
        run: cargo build --locked --release --target=x86_64-unknown-linux-musl
      - name: Package the compiled binary
        run: cargo rpm build --no-cargo-build -v --target=x86_64-unknown-linux-musl
      - name: Verify the committed lockfile is unchanged
        if: ${{ always() }}
        run: git diff --exit-code -- Cargo.lock
      - name: Scan generated RPM package
        if: ${{ always() }}
        uses: ./.github/actions/scan-secrets
        with:
          kind: rpm
          report-directory: reports/secrets-rpm
          artifact-name: agent-secrets-rpm-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload RPM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/x86_64-unknown-linux-musl/release/rpmbuild/RPMS/x86_64/*.rpm
          retention-days: 14
          if-no-files-found: error

  deb-to-fwcloud:
    needs: [agent-ci, deb-package, rpm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.repository == 'soltecsis/fwcloud-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: DEB to FWCloud
    steps:
      - name: Download DEB from this execution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: deb-package
      - name: Upload DEB package
        uses: SamKirkland/FTP-Deploy-Action@d0aa83872616587eb552bc831bb9166b3f9c5ad5 # 4.3.0
        with:
          server: ${{ secrets.FWCLOUD_PKG_FTP_HOST }}
          username: ${{ secrets.FWCLOUD_PKG_FTP_USERNAME }}
          password: ${{ secrets.FWCLOUD_PKG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deb-package/
          server-dir: ./fwcloud-agent/deb/

  rpm-to-fwcloud:
    needs: [agent-ci, deb-package, rpm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.repository == 'soltecsis/fwcloud-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: RPM to FWCloud
    steps:
      - name: Download RPM from this execution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rpm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: rpm-package
      - name: Upload RPM package
        uses: SamKirkland/FTP-Deploy-Action@d0aa83872616587eb552bc831bb9166b3f9c5ad5 # 4.3.0
        with:
          server: ${{ secrets.FWCLOUD_PKG_FTP_HOST }}
          username: ${{ secrets.FWCLOUD_PKG_FTP_USERNAME }}
          password: ${{ secrets.FWCLOUD_PKG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./rpm-package/
          server-dir: ./fwcloud-agent/rpm/

  deb-to-packagecloud:
    needs: [agent-ci, deb-package, rpm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.repository == 'soltecsis/fwcloud-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: DEB to Packagecloud
    strategy:
      fail-fast: false
      matrix:
        dist: [any/any, ubuntu/bionic, ubuntu/cosmic, ubuntu/disco, ubuntu/eoan, ubuntu/focal, ubuntu/groovy, ubuntu/hirsute, ubuntu/impish, ubuntu/jammy, debian/jessie, debian/stretch, debian/buster, debian/bullseye, debian/bookworm, debian/trixie, linuxmint/ulyana, linuxmint/ulyssa, linuxmint/uma, linuxmint/una]
    steps:
      - name: Download DEB from this execution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: deb-package
      - name: Publish package
        uses: danielmundi/upload-packagecloud@46cd0e61152bf952dbc0d1759e609d3d22649030 # v1
        with:
          PACKAGE-NAME: ./deb-package/*.deb
          PACKAGECLOUD-USERNAME: ${{ secrets.PACKAGECLOUD_USERNAME }}
          PACKAGECLOUD-REPO: FWCloud
          PACKAGECLOUD-DISTRIB: ${{ matrix.dist }}
          PACKAGECLOUD-TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

  rpm-to-packagecloud:
    needs: [agent-ci, deb-package, rpm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.repository == 'soltecsis/fwcloud-agent' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: RPM to Packagecloud
    strategy:
      fail-fast: false
      matrix:
        dist: [rpm_any/rpm_any, el/7, el/8, el/9, fedora/30, fedora/31, fedora/32, fedora/33, fedora/34, fedora/35, fedora/36]
    steps:
      - name: Download RPM from this execution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rpm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: rpm-package
      - name: Publish package
        uses: danielmundi/upload-packagecloud@46cd0e61152bf952dbc0d1759e609d3d22649030 # v1
        with:
          PACKAGE-NAME: ./rpm-package/*.rpm
          PACKAGECLOUD-USERNAME: ${{ secrets.PACKAGECLOUD_USERNAME }}
          PACKAGECLOUD-REPO: FWCloud
          PACKAGECLOUD-DISTRIB: ${{ matrix.dist }}
          PACKAGECLOUD-TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
