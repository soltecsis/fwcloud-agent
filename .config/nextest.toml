[profile.ci]
fail-fast = false
# Application fixtures and collector configuration use separate runtime directories.
test-threads = 4
retries = 0
status-level = "fail"
final-status-level = "fail"
success-output = "never"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
report-skipped = "all"
